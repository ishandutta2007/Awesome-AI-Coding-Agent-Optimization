<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes pulsePurple {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.12) translate(-20px, 18px); opacity: 0.55; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes scanLine {
      0% { transform: translateY(-10px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(370px); opacity: 0; }
    }

    .orb-cyan { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 15% 30%; }
    .orb-purple { animation: pulsePurple 10s ease-in-out infinite; transform-origin: 85% 70%; }
    .stream-line { stroke-dasharray: 20 15; animation: dashStream 16s linear infinite; }
    .stream-line-rev { stroke-dasharray: 12 12; animation: dashStream 20s linear reverse infinite; }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite; }
    .scanner { animation: scanLine 7s ease-in-out infinite; }
  </style>

  <!-- Base background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Animated Ambient Orbs in background -->
  <circle cx="180" cy="110" r="140" fill="#0284c7" filter="url(#glow-cyan)" class="orb-cyan" />
  <circle cx="1020" cy="240" r="160" fill="#7c3aed" filter="url(#glow-purple)" class="orb-purple" />
  <circle cx="900" cy="80" r="90" fill="#38bdf8" filter="url(#glow-cyan)" class="orb-cyan" style="animation-delay: -3s;" />

  <!-- Grid overlay -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic circuit / connection waves in middle ground -->
  <g fill="none" opacity="0.45">
    <path d="M -50 280 C 200 320, 350 200, 600 240 C 850 280, 1000 160, 1250 180" stroke="#38bdf8" stroke-width="2.5" class="stream-line" />
    <path d="M -50 100 C 250 60, 450 160, 700 120 C 950 80, 1050 220, 1250 200" stroke="#818cf8" stroke-width="1.8" class="stream-line-rev" />
    <path d="M -50 200 Q 300 250, 600 180 T 1250 220" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="8 8" />
  </g>

  <!-- Scanning laser line in background -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#primary-grad)" stroke-width="1" class="scanner" />

  <!-- Tech Floating Status Pills (Right Side) -->
  <g class="pill-1" transform="translate(860, 60)">
    <rect width="280" height="42" rx="21" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="22" cy="21" r="5" fill="#22c55e" />
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Token Cost: -65% Optimized</text>
  </g>

  <g class="pill-2" transform="translate(890, 120)">
    <rect width="250" height="42" rx="21" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="22" cy="21" r="5" fill="#38bdf8" />
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 Minimal Diffs &amp; YAGNI</text>
  </g>

  <g class="pill-1" transform="translate(850, 180)">
    <rect width="290" height="42" rx="21" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="22" cy="21" r="5" fill="#a855f7" />
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Autonomous Agent Pipelines</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Tags (Guaranteed High Contrast & Layered on Top) -->
  <g transform="translate(80, 0)">
    <!-- Top badge pill -->
    <g transform="translate(0, 56)">
      <rect width="260" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="14" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">✨ CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome AI Coding Agent
    </text>
    <text x="0" y="198" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Optimization &amp; Efficiency
    </text>

    <!-- Subtitle / Value proposition -->
    <text x="0" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      The definitive directory of SaaS platforms, OSS agent middleware, cost reduction,
    </text>
    <text x="0" y="270" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      token trimming techniques &amp; autonomous developer agent frameworks.
    </text>

    <!-- Footer Specs / Highlights -->
    <g transform="translate(0, 305)">
      <text x="0" y="0" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">🚀 SaaS Leaders</text>
      <text x="120" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">•</text>
      <text x="140" y="0" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">⚡ Open Source Agents</text>
      <text x="310" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">•</text>
      <text x="330" y="0" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">💰 Token &amp; Cost Reduction</text>
      <text x="535" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">•</text>
      <text x="555" y="0" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">🛠️ Minimal Diffs</text>
    </g>
  </g>

  <!-- Clean outer border -->
  <rect width="1198" height="358" x="1" y="1" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
